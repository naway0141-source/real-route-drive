          const targetSpd = 65 * appState.speedMultiplier;
          appState.speedKmh += (targetSpd - appState.speedKmh) * Math.min(1, dt * 2.5);
          // 日本の左側通行に合わせてやや左車線寄り（-1.8m）を走行
          appState.lateralOffset += (-1.8 - appState.lateralOffset) * Math.min(1, dt * 3.0);
          appState.steerAngle *= 0.85;
        }
      } else {
        const throttle = keys.up ? 1 : 0;
        const brake = keys.down ? 1 : 0;
        const steer = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);

        if (throttle > 0) {
          appState.speedKmh = Math.min(160 * appState.speedMultiplier, appState.speedKmh + 55 * dt);
        } else if (brake > 0) {
          appState.speedKmh = Math.max(0, appState.speedKmh - 110 * dt);
        } else {
          appState.speedKmh = Math.max(0, appState.speedKmh - 15 * dt);
        }

        appState.steerAngle += (steer - appState.steerAngle) * Math.min(1, dt * 10);
        appState.lateralOffset += appState.steerAngle * 9.5 * (Math.min(1, appState.speedKmh / 30)) * dt;
        appState.lateralOffset = Math.max(-4.3, Math.min(4.3, appState.lateralOffset));
      }

      // 走行距離の更新
      appState.currentDist += (appState.speedKmh / 3.6) * dt;

      if (appState.currentDist >= appState.totalDistance) {
        appState.currentDist = appState.totalDistance;
        appState.arrived = true;
        appState.driving = false;
        showArrivalModal();
      }
    }

    function updateCameraPose() {
      const curr = sampleRouteAtDistance(appState.currentDist);
      const ahead = sampleRouteAtDistance(Math.min(appState.totalDistance, appState.currentDist + 24));

      const rx = Math.cos(curr.heading);
      const rz = -Math.sin(curr.heading);

      const camX = curr.x + rx * appState.lateralOffset;
      const camY = curr.y + 1.55;
      const camZ = curr.z + rz * appState.lateralOffset;

      const arx = Math.cos(ahead.heading);
      const arz = -Math.sin(ahead.heading);
      const lookX = ahead.x + arx * appState.lateralOffset * 0.7;
      const lookY = ahead.y + 1.25;
      const lookZ = ahead.z + arz * appState.lateralOffset * 0.7;

      camera.position.set(camX, camY, camZ);
      camera.lookAt(lookX, lookY, lookZ);

      if (groundPlane) {
        groundPlane.position.set(camX, -35, camZ);
      }
    }

    // =========================================================================
    // 6. コックピット＆カーナビミニマップHUD描画
    // =========================================================================
    function drawHUD() {
      if (!hudCtx || !hudCanvas) return;
      const w = hudCanvas.width;
      const h = hudCanvas.height;
      hudCtx.clearRect(0, 0, w, h);

      if (!appState.hasRoute) return;

      const curr = sampleRouteAtDistance(appState.currentDist);
      const remainKm = Math.max(0, (appState.totalDistance - appState.currentDist) / 1000).toFixed(2);
      const progress = Math.min(1, appState.currentDist / Math.max(1, appState.totalDistance));

      // -----------------------------------------------------------------------
      // 上部中央：ルート進行バー＆現在の通過道路名
      // -----------------------------------------------------------------------
      const barW = Math.min(440, w * 0.78);
      const bx = (w - barW) * 0.5;
      const by = w < 768 ? 82 : 52;

      hudCtx.fillStyle = 'rgba(2, 6, 23, 0.78)';
      hudCtx.beginPath();
      hudCtx.roundRect(bx - 10, by - 6, barW + 20, 48, 12);
      hudCtx.fill();

      hudCtx.font = 'bold 12px "Noto Sans JP", sans-serif';
      hudCtx.fillStyle = '#38bdf8';
      hudCtx.textAlign = 'left';
      hudCtx.fillText(`現在地：${curr.roadName}`, bx, by + 11);

      hudCtx.font = 'bold 11px "Share Tech Mono", monospace';
      hudCtx.fillStyle = '#34d399';
      hudCtx.textAlign = 'right';
      hudCtx.fillText(`残り ${remainKm} km`, bx + barW, by + 11);

      // プログレスバー
      hudCtx.fillStyle = 'rgba(30, 41, 59, 0.9)';
      hudCtx.fillRect(bx, by + 20, barW, 7);
      hudCtx.fillStyle = '#38bdf8';
      hudCtx.fillRect(bx, by + 20, barW * progress, 7);

      hudCtx.font = '10px "Noto Sans JP", sans-serif';
      hudCtx.fillStyle = '#cbd5e1';
      hudCtx.textAlign = 'left';
      hudCtx.fillText(`${appState.fromName} → ${appState.toName}`, bx, by + 38);

      // -----------------------------------------------------------------------
      // 右下（PC）／右上（スマホ）：ルート全体ミニマップ＆現在位置マーカー
      // -----------------------------------------------------------------------
      const mapSize = w < 640 ? 92 : 124;
      const mx = w - mapSize - 16;
      const my = w < 640 ? 140 : h - mapSize - 105;

      hudCtx.fillStyle = 'rgba(2, 6, 23, 0.82)';
      hudCtx.strokeStyle = 'rgba(56, 189, 248, 0.45)';
      hudCtx.lineWidth = 1.5;
      hudCtx.beginPath();
      hudCtx.roundRect(mx, my, mapSize, mapSize, 14);
      hudCtx.fill();
      hudCtx.stroke();

      const samples = routeData.samples;
      if (samples.length > 1) {
        let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
        for (const s of samples) {
          if (s.x < minX) minX = s.x;
          if (s.x > maxX) maxX = s.x;
          if (s.z < minZ) minZ = s.z;
          if (s.z > maxZ) maxZ = s.z;
        }
        const span = Math.max(100, maxX - minX, maxZ - minZ);
        const pad = 16;
        const drawArea = mapSize - pad * 2;
        const cx = (minX + maxX) * 0.5;
        const cz = (minZ + maxZ) * 0.5;

        const toMapX = (wx) => mx + mapSize * 0.5 + ((wx - cx) / span) * drawArea;
        const toMapY = (wz) => my + mapSize * 0.5 + ((wz - cz) / span) * drawArea;

        // ルート軌跡ライン
        hudCtx.strokeStyle = '#38bdf8';
        hudCtx.lineWidth = 2.5;
        hudCtx.beginPath();
        for (let i = 0; i < samples.length; i += 2) {
          const px = toMapX(samples[i].x);
          const py = toMapY(samples[i].z);
          if (i === 0) hudCtx.moveTo(px, py);
          else hudCtx.lineTo(px, py);
        }
        hudCtx.stroke();

        // ゴールピン
        const last = samples[samples.length - 1];
        hudCtx.fillStyle = '#10b981';
        hudCtx.beginPath();
        hudCtx.arc(toMapX(last.x), toMapY(last.z), 4, 0, Math.PI * 2);
        hudCtx.fill();

        // 現在位置ドット
        hudCtx.fillStyle = '#f43f5e';
        hudCtx.beginPath();
        hudCtx.arc(toMapX(curr.x), toMapY(curr.z), 4.5, 0, Math.PI * 2);
        hudCtx.fill();
      }

      // -----------------------------------------------------------------------
      // 下部コックピットダッシュボード＆スピードメーター
      // -----------------------------------------------------------------------
      const dashH = w < 768 ? 72 : 90;
      const dashY = h - dashH;
      hudCtx.fillStyle = 'rgba(3, 7, 18, 0.88)';
      hudCtx.beginPath();
      hudCtx.moveTo(0, dashY + 12);
      hudCtx.lineTo(w * 0.25, dashY);
      hudCtx.lineTo(w * 0.75, dashY);
      hudCtx.lineTo(w, dashY + 12);
      hudCtx.lineTo(w, h);
      hudCtx.lineTo(0, h);
      hudCtx.closePath();
      hudCtx.fill();

      hudCtx.strokeStyle = 'rgba(56, 189, 248, 0.35)';
      hudCtx.lineWidth = 1.5;
      hudCtx.stroke();

      hudCtx.textAlign = 'center';
      hudCtx.font = w < 768 ? 'bold 26px "Share Tech Mono", monospace' : 'bold 34px "Share Tech Mono", monospace';
      hudCtx.fillStyle = '#f8fafc';
      hudCtx.fillText(`${Math.round(appState.speedKmh)} km/h`, w * 0.5, dashY + (w < 768 ? 36 : 44));

      hudCtx.font = '11px "Noto Sans JP", sans-serif';
      hudCtx.fillStyle = '#94a3b8';
      const modeText = appState.autoCruise ? '自動ドライブ中（矢印キーで手動切替）' : '手動ドライブ中';
      hudCtx.fillText(modeText, w * 0.5, dashY + (w < 768 ? 56 : 68));
    }

    function showArrivalModal() {
      const km = (appState.totalDistance / 1000).toFixed(2);
      document.getElementById('arrival-summary').textContent =
        `${appState.fromName} → ${appState.toName}（走行距離 ${km} km）`;
      document.getElementById('arrival-overlay').classList.remove('hidden');
    }

    // =========================================================================
    // 7. UIイベント＆アニメーションループ
    // =========================================================================
    function setupEvents() {
      // プリセットボタン
      document.querySelectorAll('.preset-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          document.getElementById('input-from').value = btn.dataset.from;
          document.getElementById('input-via').value = '';
          document.getElementById('input-to').value = btn.dataset.to;
          document.getElementById('route-candidates-box').classList.add('hidden');
          searchedRouteCache.key = '';
        });
      });

      // 出発地と目的地の入れ替え（逆走ルート）ボタン
      document.getElementById('btn-swap-places').addEventListener('click', () => {
        const fromEl = document.getElementById('input-from');
        const toEl = document.getElementById('input-to');
        const tmp = fromEl.value;
        fromEl.value = toEl.value;
        toEl.value = tmp;
        document.getElementById('route-candidates-box').classList.add('hidden');
        searchedRouteCache.key = '';
      });

      document.getElementById('btn-search-routes').addEventListener('click', async () => {
        const btn = document.getElementById('btn-search-routes');
        btn.disabled = true;
        btn.classList.add('opacity-60');
        try {
          await searchRouteCandidates();
        } catch (err) {
          setStatus(err.message || 'ルート検索に失敗しました', false, true);
        } finally {
          btn.disabled = false;
          btn.classList.remove('opacity-60');
        }
      });

      document.getElementById('btn-build-drive').addEventListener('click', buildRealRouteWorld);

      document.getElementById('btn-open-route-modal').addEventListener('click', () => {
        document.getElementById('route-modal').classList.remove('hidden');
      });

      document.getElementById('btn-close-modal').addEventListener('click', () => {
        document.getElementById('route-modal').classList.add('hidden');
      });

      document.getElementById('btn-drive-again').addEventListener('click', () => {
        appState.currentDist = 0;
        appState.arrived = false;
        appState.driving = true;
        document.getElementById('arrival-overlay').classList.add('hidden');
      });

      document.getElementById('btn-new-route').addEventListener('click', () => {
        document.getElementById('arrival-overlay').classList.add('hidden');
        document.getElementById('route-modal').classList.remove('hidden');
      });

      // 速度倍率トグル
      const mults = [1.0, 1.5, 2.5, 4.0];
      let multIdx = 1;
      document.getElementById('btn-speed-mult').addEventListener('click', (e) => {
        multIdx = (multIdx + 1) % mults.length;
        appState.speedMultiplier = mults[multIdx];
        e.target.textContent = `SPEED: ${appState.speedMultiplier}x`;
      });

      // オートクルーズトグル
      document.getElementById('btn-cruise').addEventListener('click', (e) => {
        appState.autoCruise = !appState.autoCruise;
        e.target.textContent = appState.autoCruise ? 'CRUISE: ON' : 'CRUISE: OFF';
      });

      // 時間帯サイクル
      document.getElementById('btn-time').addEventListener('click', () => {
        appState.timeOfDay = (appState.timeOfDay + 4) % 24;
        updateTimeLighting();
      });

      // サウンドトグル
      let engineOsc = null;
      let engineGain = null;
      document.getElementById('btn-sound').addEventListener('click', async (e) => {
        appState.soundEnabled = !appState.soundEnabled;
        e.target.textContent = appState.soundEnabled ? 'SOUND: ON' : 'SOUND: OFF';
        if (appState.soundEnabled && !engineOsc) {
          await Tone.start();
          engineGain = new Tone.Gain(0.03).toDestination();
          engineOsc = new Tone.Oscillator(55, 'triangle').connect(engineGain);
          engineOsc.start();
        } else if (engineGain) {
          engineGain.gain.rampTo(appState.soundEnabled ? 0.03 : 0, 0.1);
        }
      });

      // キーボード
      window.addEventListener('keydown', (e) => {
        if (e.code === 'ArrowUp' || e.code === 'KeyW') keys.up = true;
        if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.down = true;
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
        if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
      });
      window.addEventListener('keyup', (e) => {
        if (e.code === 'ArrowUp' || e.code === 'KeyW') keys.up = false;
        if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.down = false;
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
        if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
      });

      // モバイルタッチボタン
      const bindTouch = (id, key) => {
        const el = document.getElementById(id);
        if (!el) return;
        el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; }, { passive: false });
        el.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; }, { passive: false });
        el.addEventListener('mousedown', () => { keys[key] = true; });
        el.addEventListener('mouseup', () => { keys[key] = false; });
      };
      bindTouch('m-left', 'left');
      bindTouch('m-right', 'right');
      bindTouch('m-gas', 'up');
      bindTouch('m-brake', 'down');
    }

    function handleResize() {
      const container = document.getElementById('three-container');
      if (camera && renderer && container) {
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
      }
      if (hudCanvas) {
        hudCanvas.width = window.innerWidth;
        hudCanvas.height = window.innerHeight;
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(0.05, clock.getDelta());

      if (appState.hasRoute) {
        updateDriveSimulation(dt);
        updateCameraPose();
      }

      renderer.render(scene, camera);
      drawHUD();
    }

    window.onload = function () {
      hudCanvas = document.getElementById('hud-canvas');
      hudCtx = hudCanvas.getContext('2d');
      handleResize();

      initThree();
      setupEvents();
      window.addEventListener('resize', handleResize);

      animate();
    };
  </script>
</body>
</html>
